name: SourceIOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SOURCE_ENGINE_LINKED: 0
    SOURCE_ENGINE_LDFLAGS: ""
targets:
  SourceIOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, Generated]
      - path: App/Generated
      - path: Engine
        excludes: [Upstream]
    dependencies:
      - sdk: MetalKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.skb8.srceng
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Engine/EngineSession.h
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) SOURCE_ENGINE_LINKED=$(SOURCE_ENGINE_LINKED)"
        OTHER_LDFLAGS: "$(inherited) $(SOURCE_ENGINE_LDFLAGS)"
    scheme:
      gatherCoverageData: false

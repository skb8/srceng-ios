name: Source iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.sdk }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    env:
      SDK: ${{ matrix.sdk }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew install glslang spirv-cross spirv-tools xcodegen
          xcodebuild -version
          xcrun --sdk "$SDK" metal --version || xcodebuild -downloadComponent metalToolchain
      - name: Build app and compile Metal shaders
        run: scripts/build-ios.sh "$SDK"
      - name: Package unsigned app
        run: |
          app="build/$SDK/Build/Products/Release-$SDK/SourceIOS.app"
          test -x "$app/SourceIOS"
          test -s "$app/default.metallib"
          xcrun lipo "$app/SourceIOS" -verify_arch arm64
          mkdir -p artifacts
          ditto -c -k --keepParent "$app" "artifacts/SourceIOS-$SDK-unsigned.zip"
      - name: Package unsigned device IPA
        if: matrix.sdk == 'iphoneos'
        run: |
          app="build/$SDK/Build/Products/Release-$SDK/SourceIOS.app"
          ipa="artifacts/SourceIOS-unsigned.ipa"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          mkdir "$staging/Payload"
          ditto "$app" "$staging/Payload/SourceIOS.app"
          ditto -c -k --keepParent "$staging/Payload" "$ipa"
          unzip -tq "$ipa"
          for file in Info.plist SourceIOS default.metallib; do
            unzip -p "$ipa" "Payload/SourceIOS.app/$file" >/dev/null
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.sdk == 'iphoneos'
        with:
          name: SourceIOS-unsigned-ipa
          path: artifacts/SourceIOS-unsigned.ipa
          if-no-files-found: error
      - name: Launch app and capture Simulator screenshots
        if: matrix.sdk == 'iphonesimulator'
        timeout-minutes: 10
        run: |
          sim="$(xcrun simctl list -j devices available | jq -er '
            [.devices | to_entries | sort_by(.key) | .[]
              | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
              | .value[] | select(.name == "iPhone 17" and .isAvailable)]
            | last | .udid')"
          trap 'xcrun simctl shutdown "$sim" || true' EXIT
          xcrun simctl bootstatus "$sim" -b
          app="build/$SDK/Build/Products/Release-$SDK/SourceIOS.app"
          xcrun simctl install "$sim" "$app"
          mkdir -p artifacts/screenshots
          xcrun simctl launch "$sim" io.github.skb8.srceng
          sleep 4
          xcrun simctl io "$sim" screenshot artifacts/screenshots/launcher.png
          xcrun simctl launch --terminate-running-process "$sim" io.github.skb8.srceng --metal-preview
          sleep 4
          xcrun simctl io "$sim" screenshot artifacts/screenshots/touch-controls.png
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.sdk == 'iphonesimulator'
        with:
          name: SourceIOS-simulator-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SourceIOS-${{ matrix.sdk }}-unsigned
          path: artifacts/*.zip
          if-no-files-found: error
